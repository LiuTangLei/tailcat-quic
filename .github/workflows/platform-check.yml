name: Platform compatibility check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify
        required: true
        default: quic-v0.7

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: FreeBSD and OpenBSD
        shell: bash
        run: |
          set -euo pipefail
          for target in freebsd/amd64 freebsd/arm64 openbsd/amd64 openbsd/arm64; do
            IFS=/ read -r GOOS GOARCH <<<"$target"
            echo "building $target"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" GOWORK=off               go build -mod=readonly -trimpath -o /tmp/tailcat ./cmd/tailcat
          done

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build browser WASM
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=js GOARCH=wasm GOWORK=off             go build -mod=readonly -trimpath -o /tmp/main.wasm ./web
      - name: Headless browser integration
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          go test ./web -run-headless-browser-tests -count=1 -timeout=8m

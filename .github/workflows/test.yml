name: Test

on:
  push:
    branches: [h3-v0.6, h3-v0.7]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', 'LICENSE.*', '.gitignore']
  pull_request:
    branches: [h3-v0.6, h3-v0.7]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', 'LICENSE.*', '.gitignore']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go build ./...
      - run: go test -count=1 -timeout=15m ./...
      - run: go vet ./...
      - run: go test -race -p=1 -parallel=1 -count=1 -timeout=20m ./...
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - name: Require portable dependency pins
        run: |
          go list -m -json all | python3 -c '
          import json, sys
          text = sys.stdin.read(); decoder = json.JSONDecoder()
          while text.strip():
              item, pos = decoder.raw_decode(text.lstrip()); text = text.lstrip()[pos:]
              replacement = item.get("Replace", {})
              if replacement and not replacement.get("Version"):
                  raise SystemExit("unversioned/local replacement: " + replacement["Path"])
          '
  release-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cross-build every release executable
        shell: bash
        run: |
          tags=$(cat build-tags.txt)
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            IFS=/ read -r GOOS GOARCH <<< "$target"
            echo "Building $target"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" GOARM=7 go build -trimpath -o /dev/null -tags "$tags" ./cmd/tailcat
          done

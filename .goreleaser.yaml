# tailcat-quic release packages. The CLI remains tailcat for compatibility.
version: 2

builds:
  - id: tailcat
    main: ./cmd/tailcat
    binary: tailcat
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    flags:
      - -trimpath
      - -tags=netgo,omitidna,omitpemdecrypt,osusergo,ts_omit_ace,ts_omit_acme,ts_omit_advertiseexitnode,ts_omit_advertiseroutes,ts_omit_appconnectors,ts_omit_aws,ts_omit_bird,ts_omit_cachenetmap,ts_omit_captiveportal,ts_omit_capture,ts_omit_cliconndiag,ts_omit_clientmetrics,ts_omit_clientupdate,ts_omit_cloud,ts_omit_colorable,ts_omit_completion,ts_omit_completion_scripts,ts_omit_conn25,ts_omit_debug,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_desktop_sessions,ts_omit_dns,ts_omit_doctor,ts_omit_drive,ts_omit_flashappliance,ts_omit_health,ts_omit_hujsonconf,ts_omit_identityfederation,ts_omit_ipnbus,ts_omit_iptables,ts_omit_kube,ts_omit_linkspeed,ts_omit_linuxdnsfight,ts_omit_listenrawdisco,ts_omit_logtail,ts_omit_netlog,ts_omit_networkmanager,ts_omit_oauthkey,ts_omit_osrouter,ts_omit_outboundproxy,ts_omit_peerapiclient,ts_omit_peerapiserver,ts_omit_portlist,ts_omit_portmapper,ts_omit_posture,ts_omit_qrcodes,ts_omit_relayserver,ts_omit_remoteconfig,ts_omit_resolved,ts_omit_routecheck,ts_omit_runtimemetrics,ts_omit_sdnotify,ts_omit_serve,ts_omit_serviceclientprefs,ts_omit_synology,ts_omit_syslog,ts_omit_syspolicy,ts_omit_systray,ts_omit_taildrop,ts_omit_tailnetlock,ts_omit_tap,ts_omit_tpm,ts_omit_tundevstats,ts_omit_unixsocketidentity,ts_omit_useexitnode,ts_omit_useproxy,ts_omit_usermetrics,ts_omit_useroutes,ts_omit_wakeonlan,ts_omit_webbrowser,ts_omit_webclient
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      tailcat_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - THIRD_PARTY_NOTICES.md
      - docs/release-validation*.md

nfpms:
  - package_name: tailcat-quic
    homepage: https://github.com/LiuTangLei/tailcat-quic
    maintainer: LiuTangLei
    description: Point-to-point QUIC tunnel with HTTP/3 traffic, TLS 1.3 and userspace BBRv3; no account or control plane.
    license: BSD-3-Clause
    formats: [deb, rpm]
    bindir: /usr/bin
    conflicts: [tailcat, tailcat-h3]
    replaces: [tailcat-h3]
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/tailcat-quic/LICENSE
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/licenses/tailcat-quic/THIRD_PARTY_NOTICES.md
      - src: README.md
        dst: /usr/share/doc/tailcat-quic/README.md
      - src: SECURITY.md
        dst: /usr/share/doc/tailcat-quic/SECURITY.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: LiuTangLei
    name: tailcat-quic
  draft: true
  # The maintainer publishes the draft only after checking the packaged artifacts.
  name_template: "tailcat-quic v{{ .Version }}"
